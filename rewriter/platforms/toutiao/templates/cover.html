<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>{{FILENAME}}</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 608px;
  overflow: hidden;
  font-family: {{FONT_FAMILY}};
  background: {{PAGE_BG}};
  display: flex; flex-direction: column;
}
/* 底图蒙版 */
body::before {
  content: ''; position: absolute; inset: 0;
  {{BG_IMAGE}}
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0.08;
  pointer-events: none; z-index: 1;
}
/* 左侧色条 — 资讯感标识 */
body::after {
  content: ''; position: absolute; top: 0; bottom: 0; left: 0;
  width: 12px;
  background: {{BOTTOM_BAR_GRADIENT}};
  z-index: 2;
}
.wrapper {
  position: relative; z-index: 3;
  flex: 1; display: flex; flex-direction: column;
  padding: 30px 80px 26px;
}
/* 顶栏 — 品牌左上 + 标语右上，同行两端对齐 */
.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px;
}
.brand-badge {
  display: inline-flex; align-items: center;
  padding: 8px 20px; border-radius: 6px;
  background: {{BRAND_BADGE_BG}};
  font-size: 24px; font-weight: 600;
}
.brand-badge .name { color: {{BADGE_TEXT_COLOR}}; letter-spacing: 1px; }
.brand-slogan {
  font-size: 24px; color: {{BRAND_BAR_COLOR}};
  letter-spacing: 2px; font-weight: 500;
  opacity: 0.85;
}
.content {
  flex: 1; display: flex; flex-direction: column;
  justify-content: center;
  min-height: 0;
}
.main-title {
  font-size: {{TITLE_FS}}; color: {{MAIN_TITLE_COLOR}}; font-weight: 800;
  line-height: 1.25; text-align: left; letter-spacing: 1px;
}
.main-title .hl, .main-title em {
  background: {{ACCENT_GRADIENT}};
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; font-style: normal;
}
.divider { width: 90px; height: 5px; background: {{DIVIDER_GRADIENT}}; margin: 24px 0; }
.sub-title { font-size: {{SUBTITLE_FS}}; color: {{SUBTITLE_COLOR}}; font-weight: 600; letter-spacing: 1px; text-align: left; line-height: 1.4; }
.sub-title .hl, .sub-title em { background: {{ACCENT_GRADIENT}}; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-style: normal; }
.tagline { font-size: {{TAGLINE_FS}}; color: {{TAGLINE_COLOR}}; letter-spacing: 2px; text-align: left; margin-top: 16px; }
.badges { display: flex; gap: 28px; margin-top: 28px; font-size: {{BADGE_FS}}; color: {{TAGLINE_COLOR}}; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="top-bar">
    <div class="brand-badge">
      <span class="name">{{BRAND_NAME}}</span>
    </div>
    <div class="brand-slogan">{{BRAND_BAR}}</div>
  </div>
  <div class="content">
    <div class="main-title">{{TITLE}}</div>
    <div class="divider"></div>
    <div class="sub-title">{{SUBTITLE}}</div>
    <div class="tagline">{{TAGLINE}}</div>
    <div class="badges">{{BADGES}}</div>
  </div>
</div>
</body>
</html>
