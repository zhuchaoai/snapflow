<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>{{FILENAME}}</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 608px;
  overflow: hidden;
  font-family: {{FONT_FAMILY}};
  background: {{PAGE_BG}};
  display: flex; flex-direction: column;
}
body::before {
  content: ''; position: absolute; inset: 0;
  background: {{GRID_OVERLAY}};
  pointer-events: none; z-index: 1;
}
body::after {
  content: ''; position: absolute; top: 0; bottom: 0; left: 0;
  width: 8px;
  background: {{BOTTOM_BAR_GRADIENT}};
  z-index: 2;
}
.wrapper {
  position: relative; z-index: 3;
  flex: 1; display: flex; flex-direction: column;
  justify-content: center;
  padding: 40px 90px;
}
.page-num { font-size: {{PAGE_NUM_FS}}; color: {{PAGE_NUM_COLOR}}; font-weight: 600; margin-bottom: 12px; }
.section-title { font-size: {{SECTION_TITLE_FS}}; color: {{SECTION_TITLE_COLOR}}; font-weight: 700; letter-spacing: 2px; margin-bottom: 32px; text-align: left; }
.stats-grid {
  display: grid;
  grid-template-columns: {{STAT_GRID_COLS}};
  gap: 16px;
  align-items: stretch;
}
.stat-item {
  text-align: center;
  border-radius: 8px; border: 1px solid {{STAT_BORDER}}; background: {{STAT_BG}};
  padding: 28px 16px;
}
.stat-item.highlight { border-color: {{STAT_HIGHLIGHT_BORDER}}; background: {{STAT_HIGHLIGHT_BG}}; box-shadow: {{STAT_HIGHLIGHT_SHADOW}}; transform: scale(1.03); }
.stat-value { font-size: {{STAT_VALUE_FS}}; font-weight: 800; color: {{STAT_VALUE_COLOR}}; line-height: 1; margin-bottom: 6px; }
.stat-item.highlight .stat-value { color: {{STAT_HIGHLIGHT_VALUE_COLOR}}; }
.stat-label { font-size: {{STAT_LABEL_FS}}; color: {{STAT_LABEL_COLOR}}; line-height: 1.4; }
.footer-text { font-size: 26px; color: {{FOOTER_COLOR}}; text-align: left; margin-top: 28px; padding-top: 16px; border-top: 1px solid {{FOOTER_BORDER_COLOR}}; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="page-num">{{PAGE_NUM}}</div>
  <div class="section-title">{{SECTION_TITLE}}</div>
  <div class="stats-grid">{{STAT_ITEMS_HTML}}</div>
  <div class="footer-text">{{FOOTER_TEXT}}</div>
</div>
</body>
</html>
