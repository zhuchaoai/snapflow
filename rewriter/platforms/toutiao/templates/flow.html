<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>{{FILENAME}}</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1080px; height: 608px;
  overflow: hidden;
  font-family: {{FONT_FAMILY}};
  background: {{PAGE_BG}};
  display: flex; flex-direction: column;
}
body::before {
  content: ''; position: absolute; inset: 0;
  background: {{GRID_OVERLAY}};
  pointer-events: none; z-index: 1;
}
body::after {
  content: ''; position: absolute; top: 0; bottom: 0; left: 0;
  width: 8px;
  background: {{BOTTOM_BAR_GRADIENT}};
  z-index: 2;
}
.wrapper {
  position: relative; z-index: 3;
  flex: 1; display: flex; flex-direction: column;
  justify-content: center;
  padding: 40px 90px;
}
.page-num { font-size: {{PAGE_NUM_FS}}; color: {{PAGE_NUM_COLOR}}; font-weight: 600; margin-bottom: 12px; }
.section-title { font-size: {{SECTION_TITLE_FS}}; color: {{SECTION_TITLE_COLOR}}; font-weight: 700; letter-spacing: 2px; margin-bottom: 32px; text-align: left; }
.steps-container {
  position: relative; flex: 1;
  display: flex; flex-direction: column;
  justify-content: center;
  padding: 10px 20px 10px 40px;
}
.steps-container::before {
  content: ''; position: absolute; top: 40px; bottom: 40px; left: 34px;
  width: 2px;
  background: {{STEP_LINE_GRADIENT}};
  z-index: 0;
  border-radius: 1px;
}
.step { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 18px; position: relative; }
.step:last-child { margin-bottom: 0; }
.step-icon {
  width: 48px; height: 48px; border-radius: 24px; flex-shrink: 0;
  background: {{STEP_CIRCLE_BG}};
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: #ffffff; font-weight: 700;
  box-shadow: 0 3px 12px {{ACCENT_GLOW}};
  position: relative; z-index: 2;
}
.step-title { font-size: {{STEP_TITLE_FS}}; font-weight: 600; color: {{STEP_TITLE_COLOR}}; }
.step-desc { font-size: {{STEP_DESC_FS}}; color: {{STEP_DESC_COLOR}}; margin-top: 4px; line-height: 1.4; }
.step-arrow {
  text-align: center; font-size: 24px; color: {{STEP_ARROW_COLOR}};
  height: 28px; line-height: 28px; margin-left: 48px; margin-bottom: 4px;
}
.footer-text { font-size: 22px; color: {{FOOTER_COLOR}}; text-align: left; margin-top: 24px; padding-top: 14px; border-top: 1px solid {{FOOTER_BORDER_COLOR}}; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="page-num">{{PAGE_NUM}}</div>
  <div class="section-title">{{SECTION_TITLE}}</div>
  <div class="steps-container">
    {{STEP_ITEMS_HTML}}
  </div>
  <div class="footer-text">{{FOOTER_TEXT}}</div>
</div>
</body>
</html>
